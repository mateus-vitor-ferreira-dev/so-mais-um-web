name: CI/CD - Só+1 Web

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      # Lê os dois relatórios que o passo acima grava. O `test:ci` roda com
      # cobertura por isso: o README anuncia a porcentagem, e sem relatório
      # legível por máquina ela só seria conferida a olho — que é como foi de
      # ~28% para ~62% sem ninguém atualizar a frase.
      #
      # Rotas e páginas sob demanda não passam por aqui: são conferidas dentro
      # da própria suíte, em `src/routes/numeros-do-readme.test.tsx`.
      #
      # Fatal só no release. Cobrar o total de testes em todo PR fazia dois PRs
      # abertos juntos conflitarem na MESMA linha do README, e o conserto era
      # recontar à mão. Agora o número é gerado (`npm run readme:fix`).
      #
      # Isto vale só para os números que saem do relatório do Vitest. Os de
      # rotas e páginas continuam fatais em todo PR, porque moram num teste da
      # própria suíte (`src/routes/numeros-do-readme.test.tsx`) — e teste não
      # deve saber para qual branch o PR aponta.
      - name: Confere os números do README
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref_name }}" = "main" ]; then
            npm run readme:check
          else
            npm run readme:check || {
              echo "::warning::Os números do README divergem. Rode 'npm run readme:fix' e commite — isto só reprova no release para a main."
              exit 0
            }
          fi

      # O tipo que descreve a api pode ficar atrasado sem quebrar nada — e foi
      # o que aconteceu duas vezes com o `OcupacaoDaQuadra.tipo` (web#416). O
      # `AgendaDaQuadra` mostra a `descricao` que a api manda e nunca ramifica
      # por `tipo`, então o valor desconhecido aparece certo na tela.
      #
      # **Falta é fatal em todo evento**: a api serve um tipo e a união não o
      # tem. É a defasagem, e é o defeito.
      #
      # **Sobra é aviso em PR e na `develop`**: a união conhece um tipo que
      # produção ainda não serve. Esse é o estado normal entre o merge daqui e
      # o deploy da api, e reprovar nele obrigaria a acertar a ordem do release
      # entre dois repositórios — o custo que a api-collection#92 cronometrou em
      # 90 minutos. Mesma assimetria do `verifica-cobertura.py` da collection.
      #
      # O script NÃO reprova quando a api não responde: indisponibilidade dela
      # não é defeito daqui, e vermelho por causa alheia ensina todo mundo a
      # ignorar vermelho.
      - name: Confere o contrato com a api
        run: |
          npm run contrato:check -- ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main') || (github.event_name == 'push' && github.ref_name == 'develop')) && '--sobra-como-aviso' || '' }}

      # Peso não quebra teste: um import a mais numa tela de login volta a
      # empacotar Leaflet e componente de rota autenticada no chunk da raiz, e
      # o app continua correto — só que lento. Ver docs/PERFORMANCE-317-SEM-BARREL.md.
      - name: Confere o que a primeira tela carrega
        run: npm run primeira-tela:check

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          else
            npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          fi

      - name: Build project artifacts
        env:
          VITE_API_URL: https://api.so-mais-um.com
          VITE_GOOGLE_CLIENT_ID: 446784228326-i78g3nfnmdvpgoqt6bmdgr43hc756p13.apps.googleusercontent.com
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel build --prod --token=$VERCEL_TOKEN
          else
            npx vercel build --token=$VERCEL_TOKEN
          fi

      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
          fi
